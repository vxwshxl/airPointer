name: Release

# Fully automatic releases.
#
# - Every push to main that changes the app (Sources/, Resources/, Package.swift,
#   scripts/build-app.sh) publishes the next version. Doc/CI-only pushes don't release.
# - PRs merged by the PR Review workflow call this workflow directly.
# - Version bump: patch by default. Label the PR `release:minor` or `release:major` for bigger
#   bumps, or `skip-release` to not release it. Pushing a tag like v2.0.0 by hand also works.
# - Every release attaches airPointer-x.y.z.zip and a stable airPointer.zip, so
#   https://github.com/<owner>/<repo>/releases/latest/download/airPointer.zip is always current.
#
# Optional, for signed + notarized builds that open without Gatekeeper warnings, add:
#   MACOS_CERT_P12        base64 of your "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD   password for that .p12
#   NOTARY_APPLE_ID       Apple ID email
#   NOTARY_TEAM_ID        10-character Team ID
#   NOTARY_PASSWORD       app-specific password for notarytool
# Without them, releases are ad-hoc signed (users approve once in System Settings).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_call:
    inputs:
      bump:
        type: string
        default: auto
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      bump: ${{ steps.plan.outputs.bump }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          skip() { echo "release=false" >> "$GITHUB_OUTPUT"; echo "No release: $1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          if [ "$REF_TYPE" = "tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git tag --points-at HEAD | grep -q '^v'; then skip "HEAD is already released"; fi

          LAST=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          if [ -n "$LAST" ] && git diff --quiet "$LAST" HEAD -- Sources Resources Package.swift scripts/build-app.sh; then
            skip "no app changes since $LAST"
          fi

          bump="$BUMP"
          if [ "$bump" = "auto" ]; then
            labels=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[0].labels[]?.name] | join(",")' 2>/dev/null || true)
            case ",$labels," in
              *,skip-release,*)    skip "PR labeled skip-release" ;;
              *,release:major,*)   bump=major ;;
              *,release:minor,*)   bump=minor ;;
              *)                   bump=patch ;;
            esac
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    # One release at a time, so two quick merges can't claim the same version.
    concurrency:
      group: release-build
      cancel-in-progress: false
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.MACOS_CERT_P12 != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          BUMP: ${{ needs.plan.outputs.bump }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            git fetch --tags --force --quiet
            LAST=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
            TAG="v$VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Releasing $TAG" >> "$GITHUB_STEP_SUMMARY"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test

      - name: Stamp version
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app
        run: |
          SIGN_IDENTITY="${SIGN_IDENTITY:--}" BUILD_NUMBER="${{ github.run_number }}" scripts/build-app.sh
          ditto -c -k --keepParent build/airPointer.app "build/airPointer-$VERSION.zip"

      - name: Notarize
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit "build/airPointer-$VERSION.zip" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple build/airPointer.app
          rm "build/airPointer-$VERSION.zip"
          ditto -c -k --keepParent build/airPointer.app "build/airPointer-$VERSION.zip"

      - name: Publish release
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          cp "build/airPointer-$VERSION.zip" build/airPointer.zip
          # Creates the tag on the released commit if it doesn't exist yet.
          gh release create "$TAG" build/airPointer.zip "build/airPointer-$VERSION.zip" \
            --repo "${{ github.repository }}" --target "$SHA" \
            --title "airPointer $VERSION" --generate-notes
